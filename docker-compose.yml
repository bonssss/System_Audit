version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: system_audit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: system_audit
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & BullMQ Queue
  redis:
    image: redis:7-alpine
    container_name: system_audit_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # Next.js 15 Web Application & Scanner
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system_audit_web
    restart: always
    environment:
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/system_audit?schema=public'
      REDIS_URL: 'redis://redis:6379'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      JWT_SECRET: 'production-grade-random-secret-key-32-chars'
      AI_PROVIDER: 'local'
      STORAGE_DRIVER: 'local'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
